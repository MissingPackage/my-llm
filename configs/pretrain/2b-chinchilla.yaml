# THEORETICAL FULL RUN. Read docs/2B_FEASIBILITY.md before launching it.
# 610,352 updates * 65,536 tokens/update ~= 40.000B training tokens.
name: my-llm-2b-chinchilla-experimental
seed: 42
tokenizer_path: artifacts/tokenizer-32k
train_manifest: data/processed/fineweb-edu-40b/train-manifest.json
validation_manifest: data/processed/fineweb-edu-40b/validation-manifest.json
output_dir: artifacts/pretrain-2b
log_dir: runs/pretrain-2b
model:
  hidden_size: 2560
  intermediate_size: 6912
  num_hidden_layers: 28
  num_attention_heads: 20
  num_key_value_heads: 5
  max_position_embeddings: 2048
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true
training:
  # 512 is the aggressive fit point. A later context-extension stage would be needed
  # to exploit all 2048 positions well; this preset prioritizes laptop feasibility.
  sequence_length: 512
  micro_batch_size: 1
  gradient_accumulation_steps: 128
  max_steps: 610352
  learning_rate: 0.00025
  min_lr_ratio: 0.1
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: bf16
  parameter_dtype: bf16
  gradient_checkpointing: true
  attention_backend: sdpa
  optimizer: paged_adamw_8bit
  optimizer_min_8bit_size: 4096
  optimizer_percentile_clipping: 100
  # Benchmark 100 steps before enabling. Compile can help fixed shapes, but some
  # bitsandbytes/PyTorch combinations trade speed for graph breaks or extra VRAM.
  compile: false
  compile_mode: reduce-overhead
  prefetch_batches: 1
  # Required for an exact months-long resume; budget ample disk for optimizer state.
  save_checkpoints: true
  save_optimizer_state: true
  max_shard_size: 2GB
  empty_cache_every: 0
  log_every: 10
  eval_every: 1000
  eval_batches: 10
  save_every: 5000
  keep_last_checkpoints: 1
