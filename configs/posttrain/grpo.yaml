model_path: artifacts/reasoning-sft/final
output_dir: artifacts/reasoning-grpo
seed: 42
dataset:
  path: openai/gsm8k
  name: main
  split: train
  max_samples: null
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  max_steps: 1000
  warmup_ratio: 0.05
  weight_decay: 0.0
  num_generations: 4
  generation_batch_size: 4
  max_completion_length: 256
  temperature: 0.9
  beta: 0.0
  loss_type: dapo
  logging_steps: 5
  save_steps: 100
  save_total_limit: 2
  reward_weights: [1.0, 0.2]


