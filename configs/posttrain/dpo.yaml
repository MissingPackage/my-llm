method: dpo
model_path: artifacts/sft/final
output_dir: artifacts/dpo
seed: 42
dataset:
  path: HuggingFaceH4/ultrafeedback_binarized
  split: train_prefs
  eval_split: test_prefs
  max_samples: 30000
  max_eval_samples: 1000
training:
  max_length: 1024
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-6
  num_train_epochs: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  beta: 0.1
  logging_steps: 10
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2


