method: sft
model_path: artifacts/pretrain-debug/final
output_dir: artifacts/sft-debug
seed: 42
dataset:
  path: json
  data_files: sample_data/sft.jsonl
  split: train
  eval_split: train
  max_samples: 8
  max_eval_samples: 2
training:
  max_length: 128
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  num_train_epochs: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_steps: 1
  eval_steps: 2
  save_steps: 4
  save_total_limit: 1
  assistant_only_loss: true


